name: Secret Scanning Check

on:
    workflow_dispatch:

jobs:
    secret-scanning-check:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4
              with:
                fetch-depth: 0
            
            - name: GitLeaks Scanner
              uses: gitleaks/gitleaks-action@v3
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}