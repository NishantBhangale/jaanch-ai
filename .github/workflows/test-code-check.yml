name: Run Unit Tests
on:
    workflow_call:
jobs:
    run-unit-tests:
        name: ${{ matrix.folder }}-run-unit-tests
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                folder: [frontend, backend]     
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            - name: setup node
              uses: actions/setup-node@v6
              with:
                node-version: 24
                cache: npm
                cache-dependency-path: ${{ matrix.folder }}/package-lock.json
            - name: install dependencies
              run: npm ci
              working-directory: ${{ matrix.folder }}
            - name: run unit tests
              run: npm test
              working-directory: ${{ matrix.folder }}