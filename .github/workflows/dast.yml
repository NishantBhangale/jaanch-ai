name: dast

on:
  workflow_call:
    inputs:
      target_url:
        description: Live URL to scan, e.g. http://xxx.ap-south-1.elasticbeanstalk.com
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target_url:
        description: Live URL to scan
        required: true
        type: string

permissions:
  contents: read

jobs:
  dast:
    runs-on: ubuntu-latest
    steps:
      - name: Wait until the site answers
        run: |
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "${{ inputs.target_url }}/" || true)
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "Site did not return 200" && exit 1

      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ inputs.target_url }}
          fail_action: false         
          allow_issue_writing: false
          artifact_name: zap-report
