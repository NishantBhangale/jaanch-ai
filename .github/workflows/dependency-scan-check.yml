name: dependency-scan-check

on:
    workflow_dispatch:

jobs:
    dependency-scan-check:
        name: ${{ matrix.folder }}-dependency-scan-check
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                folder: [frontend, backend]
        steps:
            - name: checkout code
              uses: actions/checkout@v4
              
            - name: setup node
              uses: actions/setup-node@v6
              with:
                node-version: 24
                cache: npm
                cache-dependency-path: ${{ matrix.folder }}/package-lock.json
            
            - name: dependency-scan-${{ matrix.folder }}
              working-directory: ${{ matrix.folder }}
              run: npm audit --audit-level=high --json > audit-report.json || true

            - name: Print readable summary
              working-directory: ${{ matrix.folder }}
              run: |
                jq '.metadata.vulnerabilities' audit-report.json
                npm audit || true
              
            - name: Upload Reports to Artifact
              uses: actions/upload-artifact@v4
              with:
                name: dependency-scan-${{ matrix.folder }}-report
                path: ${{ matrix.folder }}/audit-report.json
                retention-days: 5