name: code-quality-check

on:
    workflow_dispatch:

jobs:
    frontend-linter:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            - name: setup node
              uses: actions/setup-node@v6
              with:
                node-version: 24
                cache: npm
                cache-dependency-path: ./frontend/package-lock.json
            - name: install dependencies
              run: npm ci
              working-directory: ./frontend
            - name: run eslint
              run: npm run lint
              working-directory: ./frontend
            ##########################################################
    backend-linter:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            - name: setup node
              uses: actions/setup-node@v6
              with:
                node-version: 24
                cache: npm
                cache-dependency-path: ./backend/package-lock.json
            - name: install dependencies
              run: npm ci
              working-directory: ./backend
            - name: run eslint
              run: npm run lint
              working-directory: ./backend