name: docker scan-check

on:
    workflow_dispatch:

jobs:
    docker-file-lint-and-scan:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                folder: [frontend, backend]
        steps:
            - name: checkout code
              uses: actions/checkout@v4
            - name: $ {{ matrix.folder }} dockerfile lint and scan
              uses: hadolint/hadolint-action@v3.1.0
              with:
                dockerfile: ${{ matrix.folder }}/Dockerfile
            - name: Log in to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Docker Build ${{ matrix.folder }}
              run: docker build -t ${{ vars.DOCKERHUB_USERNAME }}/jaanch-${{ matrix.folder }}:latest .
              working-directory: ${{ matrix.folder }}
            
            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@v0.36.0
              continue-on-error: true
              with:
                image-ref: ${{ vars.DOCKERHUB_USERNAME }}/jaanch-${{ matrix.folder }}:latest
                format: 'table'
                exit-code: '1'
                ignore-unfixed: true
                vuln-type: 'os,library'
                severity: 'CRITICAL'