# Jaanch.ai frontend: nginx serves the built React app and forwards API calls to the backend.
#
# Because the browser only ever talks to nginx (same origin), the backend needs no CORS setup.
#
# Where things go (official nginx image paths; change `root` if yours differs):
#   - this file       -> /etc/nginx/nginx.conf
#   - frontend/dist/  -> /usr/share/nginx/html     (output of `npm run build` in frontend/)
#
# One line to adjust: the backend address in the upstream block below.
#   backend:3000        backend container named "backend" on the same Docker network
#   127.0.0.1:3000      backend running directly on the same machine
#
# Backend setting that goes with this file: TRUST_PROXY (in backend/.env)
#   1  browser -> nginx -> backend
#   2  browser -> load balancer -> nginx -> backend   (so rate limiting sees the real visitor)

worker_processes auto;
error_log /var/log/nginx/error.log warn;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  access_log    /var/log/nginx/access.log;

  sendfile      on;
  server_tokens off;
  keepalive_timeout 65;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  upstream jaanch_backend {
    server backend:3000;
    keepalive 16;
  }

  server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Scan requests are tiny JSON bodies.
    client_max_body_size 16k;

    # Security headers. Kept at server level on purpose: an add_header inside a location would
    # replace these, so locations below use `expires` for caching instead.
    # Turn HSTS on only when the site is served over HTTPS:
    #   add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Shared proxy settings
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;

    # API (scans, reports, dashboard)
    location /api/ {
      proxy_pass http://jaanch_backend;
    }

    # Locally stored screenshots (when S3 is not used)
    location /screenshots/ {
      proxy_pass http://jaanch_backend;
    }

    # Backend health (database + worker). Use this for load balancer checks.
    location = /health {
      access_log off;
      proxy_pass http://jaanch_backend;
    }

    # nginx's own liveness check, independent of the backend
    location = /nginx-health {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Built files have hashed names, so they can be cached for a year.
    location /assets/ {
      try_files $uri =404;
      expires 1y;
    }

    # The page itself must always be re-checked, so new deployments show up immediately.
    location = /index.html {
      expires -1;
    }

    # React single-page app: /report/abc123 and /dashboard are handled by the app, not files.
    location / {
      try_files $uri /index.html;
      expires -1;
    }
  }
}
