services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${postgres_user}
      POSTGRES_PASSWORD: ${postgres_password}
      POSTGRES_DB: ${postgres_db}
    ports:
      - "${postgres_port}:5432"
    healthcheck:
       test: ["CMD-SHELL", "pg_isready -U ${postgres_user} -d ${postgres_db}"]
       interval: 5s
       timeout: 3s
       retries: 10
    volumes:
      - jaanch_postgres_data:/var/lib/postgresql/data
    networks:
      - jaanch-net
  jaanch_backend:
    build: ./backend
    container_name: jaanch_backend
    env_file:
      - ./backend/.env
    ports:
      - "${backend_port}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    shm_size: "1gb"
    volumes:
      - screenshots:/app/data/screenshots   # remove when s3 setup is done
    restart: unless-stopped
    networks:
      - jaanch-net
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama         
    environment:
      OLLAMA_KEEP_ALIVE: 24h
    volumes:
      - ollama:/root/.ollama
    restart: unless-stopped
    networks:
      - jaanch-net
 
  ollama-pull:
    profiles: ["ollama"]
    image: ollama/ollama
    depends_on:
      - ollama
    env_file: 
     - ./backend/.env
    entrypoint:
      - /bin/sh
      - -c
      - |
        export OLLAMA_HOST="$$OLLAMA_URL"
        until ollama list >/dev/null 2>&1; do sleep 2; done
        ollama pull "$$OLLAMA_MODEL"
    restart: "no"
    networks:
      - jaanch-net
  jaanch_frontend:
    build: ./frontend
    container_name: jaanch_frontend
    env_file:
      - ./frontend/.env
    ports:
      - "${frontend_port}:4173"
    depends_on:
      - jaanch_backend
    networks:
      - jaanch-net

volumes:
  jaanch_postgres_data:
  ollama:
  screenshots:
networks:
  jaanch-net:
    name: jaanch-net
    driver: bridge